---
# Example: backport a bug fix from one branch to another
# Copy this file and fill in your project-specific values.

issue_id: "example-fix-id"

bug_description: "Brief description of the bug and how the fix addresses it"

repository:
  source_path: "/path/to/your/repo"
  workdir: "/path/to/worktree/directory"

branches:
  source: "origin/main"        # branch that has the fix
  target: "origin/release-1.0" # branch that needs the fix

fix:
  commit: "abc123def456"       # commit SHA of the fix on the source branch

build:
  command: "make -j$(nproc)"                    # build command
  test_command: "make check -j$(nproc)"         # test command
  # file_check_command: "gcc -fsyntax-only {file}"  # optional per-file check after resolution

model: m1                      # profile id from models.yaml (or a bare model name)

# Optional:
# output:
#   directory: "runs/my-backport"
# advanced:
#   mechanical_resolution: true   # git-apply rungs before the LLM (ablation flag)
#   snapback: true                # snap LLM-drifted lines back to source bytes
#   evidence_checks: true         # token audit + substitution mining + follow-up scan
#   post_resolution_check: true   # Phase 3a.1 verification agent
#   blind_review: true            # Phase 3a.2 triage-blind review agent
#   partial_success_skip_ratio: 0.5  # non-bugfix ports: fraction of the fix's files
#                                    # that may be dropped before the outcome is
#                                    # downgraded to partial_success (0.0-1.0)
#   phase_4b_model: m3            # profile id for Phase 4b recovery (defaults to model)
