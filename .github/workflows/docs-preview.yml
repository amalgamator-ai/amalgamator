# Copy to amalgamator-ai/amalgamator as .github/workflows/docs-netlify-preview.yml

name: Docs Preview

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: amalgamator-ai/amalgamator-ai.github.io/.github/workflows/netlify-preview.yml@main
    with:
      caller_repo: ${{ github.repository }}
      caller_pr: ${{ github.event.pull_request.number }}
      docs_ref: ${{ github.event.pull_request.head.sha }}
      website_ref: main
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Caller's token can read private amalgamator; website GITHUB_TOKEN cannot.
      AMALGAMATOR_REPO_TOKEN: ${{ github.token }}

      