# Netlify docs preview for amalgamator PRs that touch product docs or
# community policy files the website publishes.
#
# Calls the reusable workflow in amalgamator-ai/amalgamator-ai.github.io.
# workflow_call keeps the caller's event_name (pull_request); the website
# workflow detects remote builds via the inputs below.

name: Docs Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: amalgamator-ai/amalgamator-ai.github.io/.github/workflows/netlify-preview.yml@main
    with:
      caller_repo: ${{ github.repository }}
      caller_pr: ${{ github.event.pull_request.number }}
      docs_ref: ${{ github.event.pull_request.head.sha }}
      website_ref: main
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
