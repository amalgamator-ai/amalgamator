name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` deliberately stays out of this workflow: a title or body edit
    # must not cancel and rerun the test matrix. The PR title is checked by
    # pr-title.yml instead.
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate the expensive jobs on commit metadata. The checkout is deliberately
  # the *base* branch, so the check runs trusted code; the PR head is fetched
  # as a ref only. On pushes to main this job is a no-op so the jobs below
  # still run (a skipped job would skip every dependent job too).
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch the pull request commits
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

      - name: Verify DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          python3 scripts/check_pr_metadata.py dco \
            --base-ref HEAD \
            --head-ref refs/remotes/origin/pr-head \
            --author "$PR_AUTHOR"

  # Format/lint/type-check run once, on the minimum supported Python; the
  # pytest matrix below covers the supported range.
  lint-type:
    name: Format / Lint / Type (Python 3.12)
    needs: dco
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pre-commit builds its own isolated envs for the black/ruff/hygiene
      # hooks; cache them so CI does not rebuild on every run.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --extra test --extra dev --locked --python "3.12"

      # Single source of truth for format/lint tool versions: the pinned revs
      # in .pre-commit-config.yaml. CI runs the same hooks developers do, so
      # the two can never drift. Fixing hooks (black, ruff --fix) fail here if
      # they modify anything, and --show-diff-on-failure prints what changed.
      - name: Format & lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # pyrefly is env-coupled (it resolves the project's third-party imports
      # and would report bogus missing-import errors from a pre-commit-managed
      # isolated env), so it runs directly from the locked uv environment.
      - name: Type check (pyrefly)
        run: uv run pyrefly check

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: dco
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor catches >=3.12-only breakage early; a current release
        # catches deprecations heading for the next floor bump.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Keep the uv caches of the matrix legs separate (they hold
          # interpreter-specific wheels).
          cache-suffix: py${{ matrix.python-version }}

      # --python pins the sync to the matrix interpreter (the one
      # setup-python just installed) instead of whatever else uv finds.
      - name: Install dependencies
        run: uv sync --extra test --extra dev --locked --python "${{ matrix.python-version }}"

      - name: Test (pytest)
        run: uv run pytest
