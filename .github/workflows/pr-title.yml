name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the base branch rather than the PR: the script that performs
      # the check must not come from the pull request it is validating.
      - name: Check out the trusted baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Verify PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          python3 scripts/check_pr_metadata.py title \
            --title "$PR_TITLE" \
            --author "$PR_AUTHOR"
